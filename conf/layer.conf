# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tkk-stm32mp2"
BBFILE_PATTERN_meta-tkk-stm32mp2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tkk-stm32mp2 = "6"

LAYERDEPENDS_meta-tkk-stm32mp2 = "core"
LAYERSERIES_COMPAT_meta-tkk-stm32mp2 = "scarthgap"
